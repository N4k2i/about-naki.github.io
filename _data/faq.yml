- question: "What's N4-K2?"
  answer: "N4-K2 is one of the names and identities I use around my projects and online spaces."
- question: "What's Nawkies?"
  answer: "Nawkies is the author name I use for writing-related projects."
- question: "What do you develop?"
  answer: "Minecraft mods, Roblox-related systems, game mechanics, tools, puzzle systems, automation, websites, and whatever else a project requires."
- question: "What do you write?"
  answer: "Character-heavy speculative fiction, progression fantasy, worldbuilding-heavy stories, character relationships, species, abilities, and large lore systems."
- question: "What do you use this site for?"
  answer: "It acts as a personal hub, project directory, profile, writing archive, devlog, and experiment in building an intentionally over-detailed Jekyll site."
- question: "Can I ask about your projects?"
  answer: "Absolutely. There is a significant chance the answer becomes much longer than expected."
- question: "How many projects do you have?"
  answer: "Enough that a dedicated project database became reasonable."
- question: "Why Jekyll?"
  answer: "It lets the site use reusable layouts, includes, collections, Markdown, Liquid templates, and GitHub Pages without requiring a large runtime framework."
- question: "Is the site finished?"
  answer: "Probably not. The site is designed to keep expanding."
- question: "Do you like small scopes?"
  answer: "In theory."
- question: "Why are there hidden achievements?"
  answer: "Because an About Me site is more fun when exploring it can unlock things."
- question: "Do you finish projects?"
  answer: "Next question."
