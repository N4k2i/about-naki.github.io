<section class="page-hero section">
  <div class="shell">
    <p class="eyebrow">{{ include.eyebrow | default: "N4-K2 DATABASE" }}</p>
    <h1>{{ include.title | default: page.title }}</h1>
    {% if include.description %}
      <p class="page-hero-description">{{ include.description }}</p>
    {% elsif page.description %}
      <p class="page-hero-description">{{ page.description }}</p>
    {% endif %}
  </div>
</section>
